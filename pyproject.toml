[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qshield"
version = "0.2.0"
description = "Multimodal quishing detection: Siamese visual branch + URL text branch + late fusion"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Nicolas Llerena Silva" },
    { name = "Aurea Soriano-Vargas" },
]
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "torchvision",
    "transformers>=4.40",
    "tokenizers>=0.15",
    "scikit-learn",
    "numpy",
    "pandas",
    "Pillow",
    "tqdm",
    "matplotlib",
    "seaborn",
    "pyzbar",
]

[project.optional-dependencies]
xai = ["shap", "captum"]
dev = ["pytest", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["qshield*"]
